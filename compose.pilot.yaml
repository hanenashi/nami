name: nami-pilot
services:
  nami:
    # Disposable browser-only pilot rehearsal; this host port stays loopback-only.
    image: nami-pilot:f72c53e
    pull_policy: never
    ports:
      - "127.0.0.1:3002:3000"
    user: "${NAMI_UID:-1000}:${NAMI_GID:-1000}"
    environment:
      NAMI_SECURE_COOKIES: "true"
    volumes:
      - type: bind
        source: ../nami-pilot-data
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
  public-edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "127.0.0.1:3003:8080"
    volumes:
      - ./deploy/pilot.Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=8m,mode=0700
      - /data:size=8m,mode=0700
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    init: true
    depends_on:
      nami:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
